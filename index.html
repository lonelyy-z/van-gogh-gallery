<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梵高作品集 · Vincent van Gogh Gallery</title>
<style>
  :root{
    --bg:#f5f3ef;
    --card:#ffffff;
    --ink:#1c1c1c;
    --muted:#6f6f6f;
    --line:#e5e1da;
    --accent:#b8860b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* 顶栏 */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(245,243,239,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1280px;margin:0 auto;padding:18px 28px;
    display:flex;align-items:center;gap:24px;
  }
  .logo{
    font-family:Georgia,"Times New Roman",serif;
    font-size:1.35rem;font-weight:600;letter-spacing:.5px;white-space:nowrap;
  }
  .logo em{font-style:normal;color:var(--accent)}
  .search{
    flex:1;max-width:380px;margin-left:auto;position:relative;
  }
  .search input{
    width:100%;padding:9px 14px 9px 36px;
    border:1px solid var(--line);border-radius:3px;
    background:var(--card);font-size:.9rem;color:var(--ink);outline:none;
    transition:border-color .15s;
  }
  .search input:focus{border-color:#b9b3a8}
  .search svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;fill:none;stroke:#9a948a;stroke-width:1.6;
  }

  /* hero */
  .hero{
    max-width:1280px;margin:0 auto;padding:48px 28px 24px;
  }
  .hero h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:2.1rem;font-weight:500;letter-spacing:.3px;margin-bottom:12px;
  }
  .hero p{
    color:var(--muted);font-size:.95rem;line-height:1.8;max-width:760px;
  }
  .hero .meta{margin-top:14px;font-size:.85rem;color:var(--muted)}

  /* 网格 */
  .grid{
    max-width:1280px;margin:0 auto;padding:8px 28px 60px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:22px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:2px;
    overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s;
  }
  .card:hover{box-shadow:0 8px 24px rgba(0,0,0,.10);transform:translateY(-2px)}
  .card .img{position:relative;background:#eee;overflow:hidden}
  .card img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;transition:transform .4s}
  .card:hover img{transform:scale(1.04)}
  .card .cap{padding:11px 13px 13px}
  .card .cap h3{font-family:Georgia,serif;font-weight:500;font-size:.95rem;line-height:1.35}
  .card .cap .sz{font-size:.72rem;color:var(--muted);margin-top:4px}

  /* 空状态 */
  .empty{
    grid-column:1/-1;text-align:center;padding:70px 0;color:var(--muted);
    font-size:.95rem;
  }

  /* 灯箱 */
  .lb{
    position:fixed;inset:0;z-index:100;background:rgba(18,16,12,.92);
    display:none;align-items:center;justify-content:center;padding:40px;
  }
  .lb.on{display:flex}
  .lb .box{max-width:900px;width:100%;text-align:center}
  .lb img{max-width:100%;max-height:78vh;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .t{margin-top:16px;color:#f0ede6;font-family:Georgia,serif;font-size:1.1rem}
  .lb .d{margin-top:6px;color:#a8a298;font-size:.8rem}
  .lb a.src{display:inline-block;margin-top:14px;color:#d9b45c;font-size:.82rem;border-bottom:1px solid #d9b45c}
  .lb .close{
    position:absolute;top:22px;right:28px;color:#ddd8ce;font-size:2rem;
    cursor:pointer;line-height:1;background:none;border:none;
  }
  .lb .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    color:#ddd8ce;font-size:2.4rem;cursor:pointer;background:none;border:none;
    padding:10px 14px;line-height:1;
  }
  .lb .prev{left:16px}.lb .next{right:16px}

  footer{
    border-top:1px solid var(--line);padding:30px 28px 40px;text-align:center;
    color:var(--muted);font-size:.82rem;line-height:1.8;
  }
  @media(max-width:600px){
    .bar{flex-wrap:wrap;gap:12px}
    .search{max-width:100%;order:3;flex-basis:100%}
    .hero h1{font-size:1.6rem}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">Van Gogh <em>·</em> Gallery</div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>

    </div>
  </div>
</header>

<section class="hero">
  <h1>文森特·梵高作品集</h1>
  <p>Vincent van Gogh（1853–1890），荷兰后印象派画家，一生创作了 2000 余幅作品。这里收录他的代表性绘画，全部为公共领域作品，可自由欣赏与使用。</p>
  <div class="meta" id="count"></div>
</section>

<main class="grid" id="grid"></main>

<div class="lb" id="lb">
  <button class="close" id="lbClose">&times;</button>
  <button class="nav prev" id="lbPrev">&#8249;</button>
  <button class="nav next" id="lbNext">&#8250;</button>
  <div class="box">
    <img id="lbImg" alt="">
    <div class="t" id="lbTitle"></div>
    <div class="d" id="lbDim"></div>
    <a class="src" id="lbSrc" target="_blank" rel="noopener">查看高清原图 →</a>
  </div>
</div>

<footer>
  图片来源：Artvee（公共领域艺术作品库） · 梵高作品均进入公有领域<br>
  本站仅作欣赏用途，非商业站点
</footer>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const count = document.getElementById('count');
let filtered = WORKS.slice();
let cur = -1;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  grid.innerHTML = '';
  count.textContent = `共 ${filtered.length} 幅作品`;
  if(!filtered.length){
    grid.innerHTML = '<div class="empty">没有找到匹配的作品</div>';
    return;
  }
  filtered.forEach((w,i)=>{
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <div class="img"><img loading="lazy" src="${w.thumb}" alt="${esc(w.t)}"></div>
      <div class="cap"><h3>${esc(w.t)}</h3><div class="sz">${w.hd || ''}</div></div>`;
    c.addEventListener('click',()=>open(i));
    grid.appendChild(c);
  });
}

function open(i){
  cur = i;
  const w = filtered[i];
  document.getElementById('lbImg').src = w.big;
  document.getElementById('lbTitle').textContent = w.t;
  document.getElementById('lbDim').textContent = w.hd ? '高清尺寸 ' + w.hd : '';
  document.getElementById('lbSrc').href = 'https://artvee.com' + w.slug;
  document.getElementById('lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function close(){
  document.getElementById('lb').classList.remove('on');
  document.body.style.overflow = '';
}
function step(d){
  if(filtered.length<2) return;
  cur = (cur + d + filtered.length) % filtered.length;
  open(cur);
}

q.addEventListener('input',()=>{
  const kw = q.value.trim().toLowerCase();
  filtered = WORKS.filter(w=>w.t.toLowerCase().includes(kw));
  render();
});
document.getElementById('lbClose').addEventListener('click',close);
document.getElementById('lbPrev').addEventListener('click',()=>step(-1));
document.getElementById('lbNext').addEventListener('click',()=>step(1));
document.getElementById('lb').addEventListener('click',e=>{if(e.target===e.currentTarget)close()});
document.addEventListener('keydown',e=>{
  if(document.getElementById('lb').classList.contains('on')){
    if(e.key==='Escape')close();
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  }
});

render();
</script>
